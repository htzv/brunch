name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All third-party actions are pinned by full commit SHA, with the human-
# readable tag in a trailing comment. This makes supply-chain compromise of
# any single action a non-issue here until we deliberately bump the SHA.
# When updating, look up `gh api repos/<org>/<repo>/git/refs/tags/<vN.M.P>
# --jq '.object.sha'` and bump both the SHA and the comment together.

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: install deps
        run: uv sync --extra dev
      - name: ruff check
        run: scripts/pre-commit run ruff-check --all-files
      - name: ruff format check
        run: scripts/pre-commit run ruff-format --all-files

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: install deps
        run: uv sync --extra dev
      - name: mypy
        run: scripts/pre-commit run mypy --all-files

  python-versions:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: read
        name: read scripts/python-versions.txt
        run: echo "versions=$(jq -Rsc 'split("\n") | map(select(length > 0))' scripts/python-versions.txt)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    needs: python-versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: configure git identity
        run: |
          git config --global user.name "brunch-ci"
          git config --global user.email "brunch-ci@example.invalid"
      - name: pytest (with coverage)
        run: scripts/run-tests.sh ${{ matrix.python-version }}

  build:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: build wheel + sdist
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brunch-dist
          path: dist/
          retention-days: 7
